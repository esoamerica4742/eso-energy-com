name: Go Live Readiness

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target base URL (e.g. https://app.eso-energy.com)"
        required: false
        type: string

jobs:
  readiness:
    name: Go Live Readiness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eso-energy-com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: eso-energy-com/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static gates
        run: |
          npm run lint
          npm run test
          npm run verify:backend
          npm run verify:enterprise -- --local-only

      - name: Resolve target URL
        id: target
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.target_url }}"
          SECRET="${{ secrets.GO_LIVE_TARGET_URL }}"
          if [ -n "$INPUT" ]; then
            echo "url=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$SECRET" ]; then
            echo "url=$SECRET" >> "$GITHUB_OUTPUT"
          else
            echo "Missing target URL. Provide workflow input or GO_LIVE_TARGET_URL secret."
            exit 1
          fi

      - name: Health endpoint probe
        run: |
          curl --fail --show-error --silent \
            "${{ steps.target.outputs.url }}/api/health/enterprise?probe=enode" > /tmp/health.json
          cat /tmp/health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if(!x || x.overall==='fail'){process.exit(1)}"

      - name: Run job endpoints
        env:
          JOB_TOKEN: ${{ secrets.ENODE_JOB_TOKEN }}
        run: |
          if [ -z "$JOB_TOKEN" ]; then
            echo "Missing ENODE_JOB_TOKEN secret"
            exit 1
          fi
          curl --fail --show-error --silent -X POST -H "x-job-token: $JOB_TOKEN" "${{ steps.target.outputs.url }}/api/enode/jobs/process-webhook-queue?limit=500&parallel=12"
          curl --fail --show-error --silent -X POST -H "x-job-token: $JOB_TOKEN" "${{ steps.target.outputs.url }}/api/enode/jobs/offline-check?staleMinutes=10&criticalMinutes=15&cooldownMinutes=30"
          curl --fail --show-error --silent -X POST -H "x-job-token: $JOB_TOKEN" "${{ steps.target.outputs.url }}/api/enode/jobs/rollups?hourlyHours=72&dailyDays=30&rawDays=14&fiveMinDays=120&hourlyRetainDays=730"

      - name: Telemetry webhook smoke
        env:
          TELEMETRY_WEBHOOK_URL: ${{ steps.target.outputs.url }}/api/webhook/telemetry
          ENODE_WEBHOOK_SECRET: ${{ secrets.ENODE_WEBHOOK_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_TENANT_ID: ${{ secrets.SMOKE_TENANT_ID }}
          SMOKE_SITE_ID: ${{ secrets.SMOKE_SITE_ID }}
          SMOKE_DEVICE_ID: ${{ secrets.SMOKE_DEVICE_ID }}
        run: npm run smoke:telemetry
